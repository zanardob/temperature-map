<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How hot is it?</title>

  <!-- MapLibre GL JS v5 — the only third-party code, loaded from unpkg. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <aside class="panel" aria-labelledby="panel-title">
    <h1 id="panel-title">How hot is it?</h1>
    <p class="panel-subtitle">Monthly temperatures for 3,500+ cities</p>

    <div class="segmented" role="group" aria-label="Temperature metric">
      <button type="button" data-metric="high" aria-pressed="false">High</button>
      <button type="button" data-metric="average" aria-pressed="true">Average</button>
      <button type="button" data-metric="low" aria-pressed="false">Low</button>
    </div>

    <div class="legend" role="img"
         aria-label="Temperature colour scale in degrees Celsius, using Wikipedia's weather-box colours: blue is cold, white is around 5 degrees, red is hot">
      <div class="legend-title">Temperature (&deg;C)</div>
      <div class="legend-gradient" id="legend-gradient"></div>
      <div class="legend-ticks" id="legend-ticks"></div>
    </div>
  </aside>

  <div class="bottombar">
    <button type="button" id="play" class="play-btn" aria-pressed="false" aria-label="Play month animation">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path class="icon-play" d="M4.5 2.5 13 8l-8.5 5.5z" />
        <g class="icon-pause">
          <rect x="4" y="2.5" width="3" height="11" />
          <rect x="9" y="2.5" width="3" height="11" />
        </g>
      </svg>
    </button>

    <div class="month-name" id="month-name" aria-live="polite">January</div>

    <div class="slider-wrap">
      <input type="range" id="month-slider" min="0" max="11" step="1" value="0" aria-label="Month" />
      <div class="month-ticks" id="month-ticks" aria-hidden="true"></div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <!-- Generated by the scraper; a 404 here is harmless during development. -->
  <script src="data/cities.js"></script>
  <!-- Fallback values so the page always has data to draw. -->
  <script src="mock/mock-cities.js"></script>
  <script src="app.js"></script>
</body>
</html>
